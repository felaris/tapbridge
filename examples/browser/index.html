<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapBridge demo</title>
  <style>
    :root { color-scheme: light dark; --accent: #2563eb; --ok: #16a34a; --err: #dc2626; --muted: #6b7280; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    .muted { color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: .5rem; font-weight: 600; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); }
    .dot.err { background: var(--err); }
    .card { margin: 1.5rem 0; padding: 1rem 1.25rem; border: 1px solid #8884; border-radius: .75rem; }
    #last { font: 600 1.5rem ui-monospace, monospace; word-break: break-all; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; }
    input, select, button { font: inherit; padding: .5rem .75rem; border-radius: .5rem; border: 1px solid #8886; }
    input { flex: 1 1 14rem; }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    #msg { margin-top: .75rem; min-height: 1.5rem; }
    #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
    ol { padding-left: 1.25rem; } li { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>TapBridge demo</h1>
  <p class="muted">Serve this file from localhost (e.g. <code>python3 -m http.server</code>), start TapBridge, and tap a card.</p>

  <p class="status"><span id="dot" class="dot"></span><span id="state">Connecting…</span></p>

  <div class="card">
    <div class="muted">Last card</div>
    <div id="last">—</div>
    <ol id="history" reversed></ol>
  </div>

  <div class="card">
    <strong>Write a card</strong>
    <p class="muted">The next card you tap will be written.</p>
    <form id="write">
      <input id="value" placeholder="abc123 or https://example.com/verify/abc123" required>
      <select id="type"><option value="text">Text</option><option value="uri">URI</option></select>
      <button>Write</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const URL_ = "ws://localhost:8765";
    const $ = (id) => document.getElementById(id);
    let ws;

    function setState(text, cls) {
      $("state").textContent = text;
      $("dot").className = "dot " + (cls || "");
    }
    function show(text, cls) {
      $("msg").textContent = text;
      $("msg").className = cls || "";
    }

    function connect() {
      ws = new WebSocket(URL_);
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
          case "ready":
            setState("Connected to TapBridge", "on");
            break;
          case "card": {
            $("last").textContent = msg.id;
            const li = document.createElement("li");
            li.textContent = new Date().toLocaleTimeString() + "  " + msg.id;
            $("history").prepend(li);
            break;
          }
          case "write_ok":
            show("✓ Written: " + msg.id, "ok");
            break;
          case "write_error":
            show("✗ " + msg.message, "err");   // already plain English
            break;
          case "error":
            setState("Refused by TapBridge", "err");
            show(msg.message, "err");          // e.g. which --allow-origin to add
            break;
        }
      };
      ws.onclose = (event) => {
        if (event.code !== 1008) {             // 1008 = origin refused; retrying won't help
          setState("TapBridge not running — retrying…", "err");
          setTimeout(connect, 2000);
        }
      };
    }

    $("write").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return show("Not connected to TapBridge.", "err");
      ws.send(JSON.stringify({ type: "write", id: $("value").value, recordType: $("type").value }));
      show("Tap a card to write it…");
    });

    connect();
  </script>
</body>
</html>
