name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Compute next patch version
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "v1.1.0")
          version=${latest#v}
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)
          new_tag="v${major}.${minor}.$((patch + 1))"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Bumping $latest → $new_tag"

  build-mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build — Apple Silicon (arm64)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w -X main.version=${{ needs.version.outputs.tag }}" -o dist/tapbridge-mac-arm64 ./cmd/tapbridge

      - name: Build — Intel (amd64)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w -X main.version=${{ needs.version.outputs.tag }}" -o dist/tapbridge-mac-intel ./cmd/tapbridge

      - name: Make executables
        run: chmod +x dist/tapbridge-mac-*

      - name: Copy install script
        run: cp scripts/install.sh dist/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac-binaries
          path: dist/

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add MinGW to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build — Windows x64
        run: |
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          go build -ldflags="-s -w -H windowsgui -X main.version=${{ needs.version.outputs.tag }}" -o dist\tapbridge-windows.exe ./cmd/tapbridge

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist\

  release:
    needs: [version, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-binaries
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist/

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/${{ needs.version.outputs.tag }}" \
            -f sha="${{ github.sha }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "TapBridge ${{ needs.version.outputs.tag }}"
          body: |
            ## TapBridge ${{ needs.version.outputs.tag }}

            ### Downloads

            | File | Platform |
            |------|----------|
            | `tapbridge-windows.exe` | Windows 10 / 11 (64-bit) |
            | `tapbridge-mac-arm64` | macOS — Apple Silicon (M1 and later) |
            | `tapbridge-mac-intel` | macOS — Intel |
            | `SHA256SUMS.txt` | Checksums for verifying downloads |

            ### macOS — one-line install

            ```bash
            curl -fsSL https://github.com/felaris/tapbridge/releases/latest/download/install.sh | bash
            ```

            ### Windows

            Download `tapbridge-windows.exe` and run it. SmartScreen may warn about an unsigned app — choose **More info → Run anyway**. TapBridge runs in the notification area (tray), with no console window.

            ### Quick start

            1. Plug in your NFC reader (e.g. ACR122U) and start TapBridge.
            2. From a page on `localhost`, connect to `ws://localhost:8765`.
            3. Tap a card — you receive `{"type":"card","id":"..."}`.

            See the [README](https://github.com/felaris/tapbridge#readme) and [troubleshooting guide](https://github.com/felaris/tapbridge/blob/main/docs/troubleshooting.md).
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
