name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # scard needs PC/SC headers; systray needs GTK + app-indicator.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: go vet
        run: go vet ./...

      - name: go test
        # The race detector needs cgo; Windows runners ship MinGW gcc.
        run: go test -race ./...

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -ldflags "-H windowsgui" -o dist/tapbridge.exe ./cmd/tapbridge
          else
            go build -o dist/tapbridge ./cmd/tapbridge
          fi
